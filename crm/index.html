<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CRM · ON Resort Cidade Jardim</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1a12;--ink2:#6a5444;--brown:#3b1f14;--sand:#f5f0e9;--stone:#e9e1d6;--line:rgba(42,26,18,.12);--orange:#d2601a;--orange-d:#b24f12;--teal:#1a9a95;--whats:#25d366}
*{box-sizing:border-box}
body{margin:0;font-family:"Jost",system-ui,sans-serif;font-weight:400;color:var(--ink);background:var(--sand);font-size:15px}
header{background:var(--brown);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header h1{font-size:18px;font-weight:500;margin:0;letter-spacing:.06em}
header h1 small{font-weight:300;opacity:.7;margin-left:6px;letter-spacing:0}
header .sp{flex:1}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:9px 18px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-o{background:var(--orange);color:#fff}.btn-o:hover{background:var(--orange-d)}
.btn-g{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}
main{padding:20px;max-width:1500px;margin:0 auto}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.kpi{background:#fff;border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.kpi b{display:block;font-size:28px;font-weight:500;color:var(--brown);font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink2)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;min-width:180px}
.filters input{flex:1;min-width:220px}
.wrap{background:#fff;border-radius:14px;border:1px solid var(--line);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1100px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);font-weight:500;background:var(--sand);position:sticky;top:0}
tr:hover td{background:#fbf8f4}
td small{display:block;color:var(--ink2);font-size:12.5px}
.nome{font-weight:500}
.wa{color:#128c4b;font-weight:500;text-decoration:none;white-space:nowrap}
.wa:hover{text-decoration:underline}
select.st{font:inherit;font-size:13.5px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);font-weight:500}
.st[data-v=novo]{background:#fde8d9;color:#9a3f0a}
.st[data-v=em_contato]{background:#e3f0fb;color:#1d5a8a}
.st[data-v=visita]{background:#efe6fb;color:#5b3a8f}
.st[data-v=proposta]{background:#fff4cf;color:#7a5a00}
.st[data-v=vendido]{background:#dff5e5;color:#1d6b35}
.st[data-v=perdido]{background:#eee;color:#666}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--stone);margin:2px 2px 0 0}
.tag.inv{background:#e3f5f4;color:#14706c}
.notas{max-width:260px;white-space:pre-line;font-size:13px;color:var(--ink2);max-height:4.6em;overflow:hidden}
.acts button{background:none;padding:4px 8px;color:var(--ink2);font-size:13px;border-radius:8px}
.acts button:hover{background:var(--stone);color:var(--ink)}
.empty{padding:48px;text-align:center;color:var(--ink2)}
dialog{border:0;border-radius:16px;padding:24px;width:min(560px,92vw);box-shadow:0 30px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,10,5,.5)}
dialog h2{margin:0 0 4px;font-weight:500}
dialog textarea{width:100%;min-height:200px;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);margin:12px 0}
dialog .row{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--brown);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}main{padding:12px}}
</style>
</head>
<body>
<header>
  <h1>ON RESORT <small>CRM de leads</small></h1>
  <span class="sp"></span>
  <span id="upd" style="font-size:13px;opacity:.7"></span>
  <button class="btn-g" id="reload">Atualizar</button>
  <a class="btn btn-o" id="csv" href="/api/admin/leads?formato=csv">Exportar CSV</a>
</header>
<main>
  <section class="kpis">
    <div class="kpi"><b id="kTotal">–</b><span>leads no total</span></div>
    <div class="kpi"><b id="kHoje">–</b><span>chegaram hoje</span></div>
    <div class="kpi"><b id="kSemana">–</b><span>últimos 7 dias</span></div>
    <div class="kpi"><b id="kNovos">–</b><span>aguardando contato</span></div>
    <div class="kpi"><b id="kInv">–</b><span>objetivo investir</span></div>
  </section>
  <section class="filters">
    <input id="q" type="search" placeholder="Buscar por nome, e-mail, telefone ou nota">
    <select id="fStatus"><option value="">Todos os status</option></select>
    <select id="fInteresse"><option value="">Todas as tipologias</option></select>
  </section>
  <div class="wrap">
    <table>
      <thead><tr><th>Data</th><th>Lead</th><th>Contato</th><th>Interesse</th><th>Origem</th><th>Status</th><th>Notas</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="empty">Carregando…</td></tr></tbody>
    </table>
  </div>
</main>

<dialog id="dlg">
  <h2 id="dlgTitle">Notas</h2>
  <small id="dlgSub"></small>
  <textarea id="dlgText" placeholder="Registre ligações, visitas, propostas…"></textarea>
  <div class="row"><button id="dlgCancel">Cancelar</button><button class="btn-o" id="dlgSave">Salvar</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script>
(function(){
  var STATUS={novo:"Novo",em_contato:"Em contato",visita:"Visita agendada",proposta:"Proposta",vendido:"Vendido",perdido:"Perdido"};
  var INTERESSES=["Studio 32m²","Studio ou 1Q 39m²","2 quartos 60m²","Garden","Ainda não sei"];
  var $=function(s){return document.querySelector(s)};
  var leads=[], editing=null, timer;
  Object.keys(STATUS).forEach(function(k){$("#fStatus").insertAdjacentHTML("beforeend",'<option value="'+k+'">'+STATUS[k]+'</option>')});
  INTERESSES.forEach(function(i){$("#fInteresse").insertAdjacentHTML("beforeend",'<option>'+i+'</option>')});

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function toast(t){var el=$("#toast");el.textContent=t;el.classList.add("on");setTimeout(function(){el.classList.remove("on")},2200)}
  function dt(s){if(!s)return"";var d=new Date(s.replace(" ","T")+"Z");return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}
  function fmtTel(t){var d=String(t||"").replace(/\D/g,"");if(d.length===11)return"("+d.slice(0,2)+") "+d.slice(2,7)+"-"+d.slice(7);if(d.length===10)return"("+d.slice(0,2)+") "+d.slice(2,6)+"-"+d.slice(6);return t||""}
  function wa(l){var n=(l.telefone||"").replace(/\D/g,"");if(n.length<=11)n="55"+n;
    var msg="Olá "+(l.nome||"").split(" ")[0]+", tudo bem? Aqui é do ON Resort Cidade Jardim. Vi seu interesse"+(l.interesse?" no "+l.interesse:"")+" e posso te enviar a tabela e o estudo de rentabilidade.";
    return"https://wa.me/"+n+"?text="+encodeURIComponent(msg)}

  function query(){var p=new URLSearchParams();if($("#q").value.trim())p.set("q",$("#q").value.trim());if($("#fStatus").value)p.set("status",$("#fStatus").value);if($("#fInteresse").value)p.set("interesse",$("#fInteresse").value);return p}
  function load(){
    var p=query();$("#csv").href="/api/admin/leads?"+(p.toString()?p.toString()+"&":"")+"formato=csv";
    fetch("/api/admin/leads?"+p.toString(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
      if(!d.ok)throw new Error(d.erro);
      leads=d.leads;var s=d.resumo||{};
      $("#kTotal").textContent=s.total||0;$("#kHoje").textContent=s.hoje||0;$("#kSemana").textContent=s.semana||0;$("#kNovos").textContent=s.novos||0;$("#kInv").textContent=s.investidores||0;
      $("#upd").textContent="Atualizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      render();
    }).catch(function(e){$("#rows").innerHTML='<tr><td colspan="8" class="empty">Erro ao carregar: '+esc(e.message)+'</td></tr>'});
  }
  function render(){
    if(!leads.length){$("#rows").innerHTML='<tr><td colspan="8" class="empty">Nenhum lead encontrado.</td></tr>';return}
    $("#rows").innerHTML=leads.map(function(l){
      var opts=Object.keys(STATUS).map(function(k){return'<option value="'+k+'"'+(k===l.status?" selected":"")+'>'+STATUS[k]+'</option>'}).join("");
      return'<tr data-id="'+l.id+'">'+
        '<td>'+dt(l.criado_em)+(l.interacoes>1?'<small>'+l.interacoes+' contatos · últ. '+dt(l.atualizado_em)+'</small>':'')+'</td>'+
        '<td><span class="nome">'+esc(l.nome)+'</span>'+(l.cidade?'<small>'+esc(l.cidade)+'</small>':'')+'</td>'+
        '<td><a class="wa" target="_blank" rel="noopener" href="'+wa(l)+'">'+esc(fmtTel(l.telefone))+'</a><small>'+(l.email?'<a href="mailto:'+esc(l.email)+'">'+esc(l.email)+'</a>':'')+'</small></td>'+
        '<td>'+(l.interesse?'<span class="tag">'+esc(l.interesse)+'</span>':'')+(l.objetivo?'<span class="tag'+(l.objetivo==="Investir"?" inv":"")+'">'+esc(l.objetivo)+'</span>':'')+'</td>'+
        '<td>'+esc(l.origem)+(l.utm_source?'<small>'+esc(l.utm_source)+(l.utm_campaign?' / '+esc(l.utm_campaign):'')+'</small>':'')+'</td>'+
        '<td><select class="st" data-v="'+esc(l.status)+'">'+opts+'</select></td>'+
        '<td><div class="notas">'+esc(l.notas)+'</div></td>'+
        '<td class="acts"><button data-a="notas">Notas</button><button data-a="del">Excluir</button></td></tr>';
    }).join("");
  }
  function patch(id,data){return fetch("/api/admin/leads/"+id,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)}).then(function(r){return r.json()}).then(function(d){if(!d.ok)throw new Error(d.erro);return d})}

  $("#rows").addEventListener("change",function(e){
    if(!e.target.classList.contains("st"))return;var id=e.target.closest("tr").dataset.id,v=e.target.value;
    e.target.dataset.v=v;patch(id,{status:v}).then(function(){toast("Status atualizado");var l=leads.find(function(x){return x.id==id});if(l)l.status=v}).catch(function(err){toast("Erro: "+err.message)});
  });
  $("#rows").addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;var id=b.closest("tr").dataset.id,l=leads.find(function(x){return x.id==id});
    if(b.dataset.a==="notas"){editing=l;$("#dlgTitle").textContent=l.nome;$("#dlgSub").textContent=l.telefone+(l.email?" · "+l.email:"");$("#dlgText").value=l.notas||"";$("#dlg").showModal()}
    if(b.dataset.a==="del"&&confirm("Excluir o lead "+l.nome+"? Essa ação não pode ser desfeita.")){
      fetch("/api/admin/leads/"+id,{method:"DELETE"}).then(function(r){return r.json()}).then(function(d){if(!d.ok)throw new Error(d.erro);toast("Lead excluído");load()}).catch(function(err){toast("Erro: "+err.message)});
    }
  });
  $("#dlgCancel").onclick=function(){$("#dlg").close()};
  $("#dlgSave").onclick=function(){var t=$("#dlgText").value;patch(editing.id,{notas:t}).then(function(){editing.notas=t;render();$("#dlg").close();toast("Notas salvas")}).catch(function(err){toast("Erro: "+err.message)})};
  $("#q").addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(load,350)});
  $("#fStatus").onchange=load;$("#fInteresse").onchange=load;$("#reload").onclick=load;
  setInterval(function(){if(!$("#dlg").open)load()},60000);
  load();
})();
</script>
</body>
</html>
